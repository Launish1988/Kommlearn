
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReflectVerse Web-App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <h1>ReflectVerse: Dein Gesprächs-Coach</h1>
        <button id="startBtn">Aufnahme starten</button>

        <!-- Gesprächszusammenfassung -->
        <div id="summary">
            <h2>Gesprächszusammenfassung:</h2>
            <p id="summaryText">Warte auf Aufnahme...</p>
        </div>

        <!-- Emotionale Stimmung -->
        <div id="emotion">
            <h2>Emotionale Stimmung:</h2>
            <p id="emotionResult">Wird analysiert...</p>
        </div>

        <!-- Avatare und Teilnehmer -->
        <div id="avatars">
            <h2>Gesprächsteilnehmer:</h2>
            <div class="avatar" id="avatar1" style="display: none;">
                <img src="avatar_image.png" alt="Avatar Teilnehmer 1" />
                <p id="participant1">Teilnehmer 1</p>
                <div id="participant1Summary" class="avatarSummary">Keine Zusammenfassung</div>
            </div>
            <div class="avatar" id="avatar2" style="display: none;">
                <img src="avatar_image.png" alt="Avatar Teilnehmer 2" />
                <p id="participant2">Teilnehmer 2</p>
                <div id="participant2Summary" class="avatarSummary">Keine Zusammenfassung</div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
