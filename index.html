
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReflectVerse Web-App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <h1>ReflectVerse: Dein Gesprächs-Coach</h1>
        <button id="startBtn">Aufnahme starten</button>
        
        <!-- Änderung hier: Zusammenfassung des Gesprächs -->
        <div id="summary">
            <h2>Gesprächszusammenfassung:</h2>
            <p id="summaryText">Warte auf Aufnahme...</p>
        </div>

        <!-- Emotionale Stimmung: Zeigt die allgemeine Stimmung des Gesprächs -->
        <div id="emotion">
            <h2>Emotionale Stimmung:</h2>
            <p id="emotionResult">Wird analysiert...</p>
        </div>

        <!-- Darstellung der Avatare -->
        <div id="avatars">
            <h2>Gesprächsteilnehmer:</h2>
            <div class="avatar" id="avatarAlex">
                <img src="avatar.png" alt="Avatar Alex" />
                <p>Alex</p>
                <div id="alexSummary" class="avatarSummary">Keine Zusammenfassung</div>
            </div>
            <div class="avatar" id="avatarSophie">
                <img src="avatar.png" alt="Avatar Sophie" />
                <p>Sophie</p>
                <div id="sophieSummary" class="avatarSummary">Keine Zusammenfassung</div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
